name: Build Guardião Pro APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Gerar Pacote Android APK
        run: |
          pwabuilder package --manifest https://guardiao-pro.vercel.app/manifest.json --platforms android --directory ./apk-output

      - name: Enviar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: GuardiaoPro-APK
          path: ./apk-output/

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardião Pro</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-xl text-center">
        <div class="text-4xl mb-4">🛡️</div>
        <h1 class="text-2xl font-bold text-emerald-400 mb-2">Guardião Pro</h1>
        <p class="text-sm text-slate-400 mb-6">Sistema de monitorização e segurança ativo (PWA).</p>
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-emerald-950 border border-emerald-800 text-emerald-400 rounded-full text-xs font-semibold mb-6">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Online
        </div>
        <div>
            <button id="btnInstalar" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-xl transition">
                Instalar Aplicativo
            </button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker registado com sucesso!'));
        }

        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalar');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalar.classList.remove('hidden');

            btnInstalar.addEventListener('click', () => {
                btnInstalar.classList.add('hidden');
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Utilizador aceitou instalar a PWA');
                    }
                    deferredPrompt = null;
                });
            });
        });
    </script>
</body>
</html>
